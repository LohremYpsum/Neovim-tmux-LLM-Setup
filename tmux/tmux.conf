# Maus: Tabs unten anklicken, Panes auswählen, scrollen
set -g mouse on

# Tabs (Windows) bei 1 statt 0 beginnen und nach dem Schließen neu durchnummerieren
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Ohne Prefix: Shift+Pfeil links/rechts = Tab wechseln, Shift+Pfeil runter = neuer Tab
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n S-Down  new-window -c "#{pane_current_path}"

# Neue Tabs/Splits im aktuellen Verzeichnis öffnen
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Config neu laden mit Prefix + r
bind r source-file ~/.tmux.conf \; display "tmux.conf neu geladen"

# Größerer Scroll-Verlauf, kein Escape-Delay
set -g history-limit 50000
set -sg escape-time 10

# --- Neovim + KI-Agent Setup ---

# Farben und Fokus-Events für Neovim (Auto-Reload geänderter Dateien)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g focus-events on

# Ctrl+h/j/k/l: zwischen tmux-Panes UND Neovim-Splits wechseln (ohne Prefix)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
# Ctrl+l zum Bildschirm-Leeren bleibt erreichbar über Prefix + Ctrl+l
bind C-l send-keys 'C-l'

# Prefix + a: Coding-Layout im aktuellen Verzeichnis (Neovim links, Claude rechts)
bind a run-shell "~/.local/bin/dev '#{pane_current_path}' --here"

# Statusleiste etwas ruhiger
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
